<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Photography Coach social preview">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171827"/><stop offset="1" stop-color="#34314c"/></linearGradient></defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1155" cy="44" r="325" fill="#715992" opacity=".14"/>
  <rect x="60" y="57" width="318" height="40" rx="20" fill="#46395b" stroke="#ae92c4"/>
  <text x="81" y="84" fill="#e7d5f3" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">A CODEX PHOTOGRAPHY SKILL</text>
  <text x="58" y="186" fill="#ffffff" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="56" font-weight="700">Photography Coach</text>
  <text x="61" y="251" fill="#efe7f6" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">让每次拍摄，都有一个具体的下一步</text>
  <text x="61" y="302" fill="#bdb5c9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21">基于可见证据的点评 · 忠于原图的调整 · 可练习的动作</text>
  <rect x="59" y="361" width="526" height="122" rx="22" fill="#2a2b40" stroke="#726886"/>
  <text x="87" y="406" fill="#e7d5f3" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">保留已经成立的关系</text>
  <text x="87" y="447" fill="#ffffff" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">只解决最值得解决的一件事</text>
  <text x="62" y="564" fill="#a69fb4" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">研究原型 · 分数不是客观审美排名</text>
  <rect x="650" y="85" width="571" height="470" rx="28" fill="#faf8f6"/>
  <text x="683" y="137" fill="#80748e" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">EVIDENCE → DECISION → PRACTICE</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="681" y="170" width="509" height="90" rx="18" fill="#ffffff" stroke="#ddd5e2"/>
    <circle cx="716" cy="215" r="18" fill="#7866a0"/><text x="710" y="222" fill="white" font-size="18" font-weight="700">1</text>
    <text x="752" y="206" fill="#3f3750" font-size="23" font-weight="700">看见什么</text><text x="752" y="236" fill="#827a8c" font-size="18">观察边缘、光线、主体与空间关系</text>
    <rect x="681" y="273" width="509" height="90" rx="18" fill="#ffffff" stroke="#ddd5e2"/>
    <circle cx="716" cy="318" r="18" fill="#a46e8b"/><text x="710" y="325" fill="white" font-size="18" font-weight="700">2</text>
    <text x="752" y="309" fill="#3f3750" font-size="23" font-weight="700">为什么影响观看</text><text x="752" y="339" fill="#827a8c" font-size="18">说出损失与取舍，不凭规则硬挑错</text>
    <rect x="681" y="376" width="509" height="90" rx="18" fill="#ffffff" stroke="#ddd5e2"/>
    <circle cx="716" cy="421" r="18" fill="#628b87"/><text x="710" y="428" fill="white" font-size="18" font-weight="700">3</text>
    <text x="752" y="412" fill="#3f3750" font-size="23" font-weight="700">下一次怎么拍</text><text x="752" y="442" fill="#827a8c" font-size="18">一个重拍动作 + 一次短练习</text>
  </g>
  <rect x="890" y="489" width="300" height="36" rx="18" fill="#e9e0ee"/>
  <text x="913" y="513" fill="#6d5784" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">WHOLE-FRAME CRITIQUE</text>
