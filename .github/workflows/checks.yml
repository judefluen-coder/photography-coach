name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image test dependency
        run: python -m pip install 'Pillow>=11,<13'
      - name: Run unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate knowledge structure
        run: python scripts/validate_knowledge.py
      - name: Check committed demonstration
        run: |
          python scripts/render_visual_report.py --input docs/demo/report.json --output "$RUNNER_TEMP/photography-coach-demo"
          cmp docs/demo/index.html "$RUNNER_TEMP/photography-coach-demo/index.html"
          node scripts/test_visual_report_ui.mjs docs/demo/index.html
